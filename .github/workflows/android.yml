name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Права на gradlew
        run: chmod +x ./gradlew

      - name: Unit-тесты
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Сборка debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Публикация отчёта о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - name: Публикация APK
        uses: actions/upload-artifact@v4
        with:
          name: GastroCompass-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
